name: GitHub Actions Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - "**/*.md"
      - '**/*.txt'
  workflow_dispatch:
    inputs:
      release:
        description: "Create a release"
        type: choice
        required: false
        default: 'false'
        options:
          - 'true'
          - 'false'
      version_increment:
        description: "Default semantic version release type"
        type: choice
        required: false
        default: 'patch'
        options:
          - 'major'
          - 'minor'
          - 'patch'

env:
  VERINC: ${{ github.event.inputs.version_increment || 'patch' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Checkout plugin-sdk
      uses: actions/checkout@v6
      with:
        repository: DK22Pac/plugin-sdk
        path: plugin-sdk

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Generate plugin-sdk project
      shell: cmd
      run: '"%PLUGIN_SDK_DIR%\tools\premake\premake5" vs2022 --file="%PLUGIN_SDK_DIR%\tools\premake\premake5.lua"'

    - name: Build plugin-sdk
      shell: cmd
      run: msbuild "%PLUGIN_SDK_DIR%\plugin.sln" /p:Configuration=Release /p:Platform="Mixed Platforms" /t:plugin_iii;plugin_vc;plugin_sa /m

    - name: Auto Increment Version
      uses: MCKanpolat/auto-semver-action@1.0.12
      id: versioning
      with:
        releaseType: ${{ env.VERINC }}
        incrementPerCommit: false
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure build
      shell: cmd
      run: .\premake5.exe vs2022

    - name: Build (GTASA)
      run: msbuild -m build/OpenLimitAdjuster.sln /property:Configuration=Release /property:Platform=GTASA

    - name: List Directory Recursively
      run: dir -Recurse

    - name: Copy Configuration File
      shell: pwsh
      run: |
        $ini = Join-Path $PWD "doc\III.VC.SA.LimitAdjuster.ini"
        if (-not (Test-Path $ini)) { throw "INI not found: $ini" }

        $outputRoots = @(
          "build\output\bin",
          "output\bin"
        ) | ForEach-Object { Join-Path $PWD $_ } | Where-Object { Test-Path $_ }

        if (-not $outputRoots) { throw "No build output folder found under build\\output\\bin or output\\bin." }

        foreach ($root in $outputRoots) {
          Get-ChildItem -Path $root -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $ini -Destination $_.FullName -Force
          }
        }

    - name: Create release archive
      if: |
        (github.event_name == 'push' && github.ref_name == 'master') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && github.ref_name == 'master')
      shell: powershell
      run: |
        Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Path release | Out-Null
        $sourcePath = (Resolve-Path 'bin').Path
        $releasePath = (Resolve-Path 'release').Path
        Get-ChildItem -Path bin -Recurse -File | Where-Object { $_.Extension -ne '.pdb' } | ForEach-Object {
          $target = $_.FullName.Replace($sourcePath, $releasePath)
          New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
          Copy-Item $_.FullName $target -Force
        }
        Compress-Archive -Path release\* -DestinationPath III.VC.SA.LimitAdjuster.zip -Force

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: III.VC.SA.LimitAdjuster
        path: |
          build\output\bin\**
          output\bin\**
          !**\*.pdb

    - name: Upload Release
      if: (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && github.ref_name == 'master')
      uses: ncipollo/release-action@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: false
        name: III.VC.SA.LimitAdjuster v${{ steps.versioning.outputs.version }}
        tag: v${{ steps.versioning.outputs.version }}
        artifacts: III.VC.SA.LimitAdjuster.zip
